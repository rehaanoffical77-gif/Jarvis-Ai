<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Face</title>
<style>
  html,body{
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07060d;
  }
  .mini-orb{
    position:relative;
    width:68px;
    height:68px;
    animation:float 3.2s ease-in-out infinite;
  }
  .orb{
    position:absolute;
    inset:6px;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, rgba(180,140,255,0.9), rgba(90,40,200,0.5) 40%, rgba(20,10,40,0.9) 75%);
    box-shadow:
      0 0 50px 6px rgba(124,58,237,0.55),
      0 0 100px 20px rgba(59,130,246,0.25),
      inset 0 0 40px rgba(0,0,0,0.5);
    animation:pulse 2.4s ease-in-out infinite, breathe 3.2s ease-in-out infinite;
    overflow:hidden;
  }
  .orb::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:conic-gradient(from 180deg, rgba(124,58,237,0.9), rgba(59,130,246,0.9), rgba(180,120,255,0.9), rgba(124,58,237,0.9));
    -webkit-mask:radial-gradient(circle, transparent 63%, black 64%, black 78%, transparent 79%);
    mask:radial-gradient(circle, transparent 63%, black 64%, black 78%, transparent 79%);
    animation:spin 4s linear infinite;
  }
  .orb::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 50%, transparent 0%, transparent 55%, rgba(10,5,20,0.85) 62%, rgba(10,5,20,0.95) 100%);
  }
  @keyframes spin{
    to{transform:rotate(360deg);}
  }
  @keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
  }
  @keyframes breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.06);}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 50px 6px rgba(124,58,237,0.55), 0 0 100px 20px rgba(59,130,246,0.25), inset 0 0 40px rgba(0,0,0,0.5);}
    50%{box-shadow:0 0 70px 14px rgba(124,58,237,0.85), 0 0 130px 30px rgba(59,130,246,0.4), inset 0 0 40px rgba(0,0,0,0.5);}
  }
  .orb-face{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:flex;
    gap:6px;
    z-index:2;
    animation:sway 3.2s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{transform:translate(-50%,-50%) translateX(0);}
    25%{transform:translate(-50%,-50%) translateX(-2px);}
    75%{transform:translate(-50%,-50%) translateX(2px);}
  }
  .orb-eye{
    width:5px;
    height:14px;
    border-radius:4px;
    background:linear-gradient(180deg,#ffd9f7,#e879f9);
    box-shadow:0 0 14px 3px rgba(232,121,249,0.9);
    animation:blink 3s infinite, glow 2.4s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes blink{
    0%,88%,100%{transform:scaleY(1);}
    92%{transform:scaleY(0.15);}
    96%{transform:scaleY(1);}
  }
  @keyframes glow{
    0%,100%{box-shadow:0 0 14px 3px rgba(232,121,249,0.9);}
    50%{box-shadow:0 0 22px 6px rgba(232,121,249,1);}
  }
</style>
</head>
<body>
  <div class="mini-orb">
    <div class="orb">
      <div class="orb-face">
        <div class="orb-eye"></div>
        <div class="orb-eye"></div>
      </div>
    </div>
  </div>
</body>
</html>
