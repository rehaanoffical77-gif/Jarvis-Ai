<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 Degree Mouse Control Particles</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: black;
        }
        #scene-container {
            position: absolute;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div id="scene-container"></div>

    <!-- Three.js Core Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, particles;
        let clock;
        let audioContext, analyser, dataArray, micActive = false;
        let baseCameraZ = 120;
        let smoothedVolume = 0;

        async function enableMic() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.8;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                micActive = true;
            } catch (err) {
                console.error('Mic access error:', err);
            }
        }

        function getVoiceVolume() {
            if (!micActive || !analyser) return 0;
            analyser.getByteFrequencyData(dataArray);

            // Human voice fundamental + harmonics roughly fall between 85 Hz - 3000 Hz.
            // We only look at bins in this range so music, fans, traffic, low bass etc. get ignored.
            const nyquist = audioContext.sampleRate / 2;
            const binHz = nyquist / dataArray.length;
            const minBin = Math.floor(85 / binHz);
            const maxBin = Math.min(dataArray.length - 1, Math.ceil(3000 / binHz));

            let sum = 0;
            let count = 0;
            for (let i = minBin; i <= maxBin; i++) {
                sum += dataArray[i];
                count++;
            }
            const avg = count > 0 ? sum / count : 0; // 0 - 255

            // Simple noise gate: ignore very low-level ambient sound so silence/background noise
            // doesn't trigger zoom, only a clear human voice does.
            const normalized = avg / 255;
            const noiseGate = 0.12;
            return normalized > noiseGate ? (normalized - noiseGate) / (1 - noiseGate) : 0;
        }

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();

            // 2. Camera Setup
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = baseCameraZ;

            // 3. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('scene-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            createParticles();
            
            window.addEventListener('resize', onWindowResize, false);
            
            enableMic();
            animate();
        }

        function createParticles() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const particleCount = 8000; // Thode zyada particles better dikhte hain

            for (let i = 0; i < particleCount; i++) {
                // Sphere math (360 degree distribution)
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const radius = 50;

                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.sin(phi) * Math.sin(theta);
                const z = radius * Math.cos(phi);

                vertices.push(x, y, z);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));

            // Store original positions for wave/pulse motion
            geometry.setAttribute('originalPosition', new THREE.Float32BufferAttribute(vertices.slice(), 3));

            // Random offset per particle so motion isn't uniform
            const offsets = [];
            for (let i = 0; i < particleCount; i++) {
                offsets.push(Math.random() * Math.PI * 2);
            }
            geometry.setAttribute('offset', new THREE.Float32BufferAttribute(offsets, 1));

            // Neon Purple Material
            const material = new THREE.PointsMaterial({
                color: 0xa020f0, // Bright Neon Purple
                size: 0.35,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true // Door ke particles chhote dikhenge
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function animate() {
            requestAnimationFrame(animate);

            const elapsed = clock.getElapsedTime();

            // Voice-driven zoom: jab tum bolte ho, camera zoom in/out hota hai
            const rawVolume = getVoiceVolume();
            smoothedVolume += (rawVolume - smoothedVolume) * 0.15; // smoothing taaki jitter na ho
            const zoomAmount = smoothedVolume * 60; // volume jitna zyada, utna zoom
            camera.position.z = baseCameraZ - zoomAmount;

            // Auto-rotate the whole particle sphere for constant motion
            particles.rotation.y = elapsed * 0.15;
            particles.rotation.x = Math.sin(elapsed * 0.1) * 0.2;

            // Pulse each particle outward/inward along its own radius
            const posAttr = particles.geometry.attributes.position;
            const origAttr = particles.geometry.attributes.originalPosition;
            const offsetAttr = particles.geometry.attributes.offset;

            for (let i = 0; i < posAttr.count; i++) {
                const ox = origAttr.getX(i);
                const oy = origAttr.getY(i);
                const oz = origAttr.getZ(i);
                const offset = offsetAttr.getX(i);

                const scale = 1 + Math.sin(elapsed * 1.5 + offset) * 0.08 + smoothedVolume * 0.25;

                posAttr.setXYZ(i, ox * scale, oy * scale, oz * scale);
            }
            posAttr.needsUpdate = true;

            // Slight flicker in color intensity for a "living" purple glow
            const pulse = 0.7 + Math.sin(elapsed * 2) * 0.3;
            particles.material.color.setRGB(0.63 * pulse, 0.13 * pulse, 0.94);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
